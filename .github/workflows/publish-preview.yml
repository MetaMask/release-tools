name: Publish a preview build

on:
  issue_comment:
    types: created

permissions:
  contents: read

jobs:
  publish-preview:
    if: ${{ github.event.issue.pull_request && startsWith(github.event.comment.body, '@metamaskbot publish-preview') }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: MetaMask/github-tools/.github/workflows/publish-preview-oidc.yml@v1
    with:
      environment: default-branch
      docs-url: 'https://github.com/MetaMask/release-tools/blob/main/docs/processes/preview-builds.md'
